name: Website

# Builds site/ (Astro) and publishes it to GitHub Pages at https://saibarathr.github.io/wizzzee/.
# The site reads docs/ (the command line and architecture write-ups, and the release notes for the changelog) and the
# app version in Resources/Info.plist at build time, so changes there redeploy it too. A pull request touching any of
# them gets the build without the deploy, so a docs change that breaks the site shows up before it is merged.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "Resources/Info.plist"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "Resources/Info.plist"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but a running deployment finishes. Pull request builds
# deploy nothing, so each branch's newest build replaces its older ones.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
