name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # The default toolchain on the runner image can lag behind the Swift
      # tools version the package declares.
      - name: Select the newest installed Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed 's|.*/Xcode_||; s|\.app$||' | sort -V | tail -1)"
          if [ -n "$newest" ]; then
            sudo xcode-select -s "/Applications/Xcode_${newest}.app"
          fi
          swift --version

      - name: Build
        run: swift build

      - name: Run the scanner and delete-path checks
        run: swift run Wizzzee --selftest

      - name: Build the universal app bundle
        run: ./scripts/build-app.sh

      - name: Verify architectures, icon, and ad-hoc signature
        run: |
          executable="dist/Wizzzee.app/Contents/MacOS/Wizzzee"
          test "$(lipo -archs "$executable" | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')" = "arm64 x86_64"
          test -s "dist/Wizzzee.app/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict --verbose=2 "dist/Wizzzee.app"
          test "$(codesign --display --verbose=2 "dist/Wizzzee.app" 2>&1 | sed -n 's/^Signature=//p')" = "adhoc"

      - name: Render the UI headlessly
        run: |
          ./dist/Wizzzee.app/Contents/MacOS/Wizzzee --uishot --tab tree --path Sources --out /tmp/tree.png
          ./dist/Wizzzee.app/Contents/MacOS/Wizzzee --uishot --tab files --path Sources --out /tmp/files.png
          ./dist/Wizzzee.app/Contents/MacOS/Wizzzee --uishot --tab tree --no-treemap --path Sources --out /tmp/tree-no-treemap.png
          test -s /tmp/tree.png
          test -s /tmp/files.png
          test -s /tmp/tree-no-treemap.png

      # Treemap visibility is only reachable from a menu, which a runner can't
      # click, so the bundle is asked what it would start with instead.
      - name: Check the app reads its preferences from the real domain
        run: |
          executable="dist/Wizzzee.app/Contents/MacOS/Wizzzee"
          domain=com.wizzzee.diskanalyzer
          defaults delete "$domain" showsTreemap 2>/dev/null || true

          "$executable" --prefs | grep -qx "domain: $domain"
          "$executable" --prefs | grep -qx "showsTreemap: true (default)"

          # Reading must not create the key it reports on, or every later
          # "default" would silently read "stored".
          test -z "$(defaults read "$domain" showsTreemap 2>/dev/null)"

          defaults write "$domain" showsTreemap -bool false
          "$executable" --prefs | grep -qx "showsTreemap: false (stored)"

          # Taking a screenshot must not rewrite what the user chose.
          "$executable" --uishot --tab tree --path Sources --out /tmp/prefs-render.png
          "$executable" --prefs | grep -qx "showsTreemap: false (stored)"

          defaults delete "$domain" showsTreemap
